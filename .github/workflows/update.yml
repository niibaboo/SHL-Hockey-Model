name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python shl_model.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add docs/index.html ratings_auto.json || git add docs/ || true
          git commit -m "Update SHL" || echo "no changes"
          git push
