name: Update SHL Model
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily 6am UK
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python shl_model.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add docs/index.html
          git commit -m "Update SHL" || exit 0
          git push
