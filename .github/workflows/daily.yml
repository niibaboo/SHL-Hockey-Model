name: Auto Update Hockey Model
on:
  schedule:
    - cron: '0 5 * * *' # 06:00 CET
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python fetch_fixtures.py
      - run: python model.py
      - run: |
          git config user.name "auto-bot"
          git config user.email "bot@github.com"
          git add fixtures.csv docs/index.html ratings_auto.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: fixtures $(date +%F)" && git push)
