name: Auto Update Hockey Model
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check files
        run: |
          ls -la
          echo "--- finding py files ---"
          find . -name "*.py" | head -20
      - name: Fetch fixtures
        run: python fetch_fixtures.py
      - name: Build model V10
        run: |
          # auto-find model.py wherever it is
          MODEL=$(find . -name "model.py" | head -1)
          echo "Found model at $MODEL"
          if [ -z "$MODEL" ]; then echo "No model.py found!" && exit 1; fi
          python "$MODEL"
      - name: Commit auto update
        run: |
          git config user.name "auto-bot"
          git config user.email "bot@github.com"
          git add fixtures.csv docs/index.html ratings_auto.json || true
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: fixtures $(date +%F)" && git push)
